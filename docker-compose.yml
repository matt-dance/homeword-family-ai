services:
  ollama:
    image: ollama/ollama:latest
    container_name: homeward-ollama
    volumes:
      - ollama_data:/root/.ollama
    # Host-only: lets `ollama` CLI on this computer manage models, but keeps the
    # unfiltered model API off the LAN so kids' devices must go through Homeward.
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:latest
    container_name: homeward-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./scripts/docker/pull-default-model.sh:/pull-default-model.sh:ro
    entrypoint: ["/bin/sh", "/pull-default-model.sh"]
    environment:
      - OLLAMA_HOST=ollama:11434
      - HOMEWARD_DEFAULT_MODEL=llama3.2:3b
    network_mode: service:ollama
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: homeward-gateway
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - HOMEWARD_DOCKER=true
      - HOMEWARD_OLLAMA_BASE_URL=http://ollama:11434
      - HOMEWARD_OLLAMA_MODEL=llama3.2:3b
      - HOMEWARD_CLASSIFIER_MODEL=llama3.2:3b
      - HOMEWARD_DATA_DIR=/data
      # Leave unset to auto-generate a per-install key in the data volume.
      - HOMEWARD_SECRET_KEY=${HOMEWARD_SECRET_KEY:-}
      - HOMEWARD_POLICIES_DIR=/app/policies
    volumes:
      - homeward_data:/data
      - ./policies:/app/policies:ro
    # Host-only: the web container proxies /api/v1 for every device, and the
    # gateway trusts the proxy's client-IP header only because nothing else can
    # reach this port.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: homeward-web
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - GATEWAY_URL=http://gateway:8000
    ports:
      - "80:43123"
    restart: unless-stopped

  mdns:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: homeward-mdns
    depends_on:
      web:
        condition: service_started
    network_mode: host
    environment:
      - HOMEWARD_MDNS_PORT=80
    command: ["python", "-m", "homeward_gateway.network.mdns"]
    restart: unless-stopped

volumes:
  ollama_data:
  homeward_data:
