[project]
name = "homeward-gateway"
version = "0.1.0"
description = "Homeward family AI safety gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "litellm>=1.55.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "onnx>=1.16.0",
    "numpy>=1.26.0",
    "zeroconf>=0.131.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homeward_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external services",
    "integration: API-level tests using the app test client",
    "slow: downloads or runs Whisper model (skip in quick CI with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
